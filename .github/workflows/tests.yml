name: Tests

# Lässt die ganze Testsuite laufen – jede tests/test_*.py als eigenes Skript, so wie in README.md unter
# „Entwicklung ohne Docker“ – bei jedem Pull Request, bei jedem Push auf main und dev und von Hand über
# "Run workflow". Die Prüfung heißt „Tests“: Unter Settings → Rules als Pflicht für main eingetragen, wartet ein
# Pull Request (auch mit Auto-Merge) auf sie, bevor er zusammengeführt wird – und damit vor dem Deploy.
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

# Lesen reicht: Der Lauf schreibt nichts ins Repository und braucht keine Secrets.
permissions:
  contents: read

# Ein neuer Push auf denselben Pull Request (oder Zweig) bricht den alten Lauf ab – nur der neueste Stand zählt.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Auf feste Stände gepinnt wie in deploy.yml: Ein wanderndes Tag könnte sonst morgen anderen Code ausführen.
      # Zum Heben: neue Prüfsumme eintragen.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"            # wie python:3.12-slim im Dockerfile
          cache: pip
          cache-dependency-path: requirements.txt

      # Was das Dockerfile neben den Python-Paketen mitbringt: Pango und HarfBuzz für WeasyPrint, DejaVu als
      # Ersatzschrift, ffmpeg für Videos (dort statisch aus mwader/static-ffmpeg, hier aus Ubuntu). Dazu für die
      # Tests allein poppler-utils: test_material.pdf_seiten liest Protokolle mit pdftotext wie auf dem
      # Entwicklungsrechner; ohne fiele es auf pypdf zurück, das „Titel“, als „Titel“ , liest.
      - name: Systempakete
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core ffmpeg poppler-utils
      # pytest gehört nicht ins Image, die Tests brauchen es aber: test_pruefungen_import nimmt pytest.raises, auch
      # wenn es als Skript läuft. Dieselbe Fassung wie auf dem Entwicklungsrechner.
      - name: Python-Pakete
        run: python -m pip install -r requirements.txt pytest==9.1.1
      # Die Browser-Tests und die Prüfstände tests/*.html laufen mit tests/cdp_treiber.py und dem Google Chrome, das der
      # Runner mitbringt. Fehlt es, scheitert dieser Schritt – sonst meldeten jene Tests still „übersprungen“.
      - name: Chrome für die Browser-Tests
        run: |
          echo "CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
          google-chrome --version
      # PDF/A-Prüfung der Protokolle und Berichte wie auf dem Entwicklungsrechner (dort st-vera): veraPDF mit fester
      # Version aus Maven Central (tests/verapdf/pom.xml), mit Java und Maven des Runners. VERAPDF nennt den Tests den
      # Aufruf (tests/test_material.py, pdfa_pruefer); startet veraPDF nicht, scheitert schon dieser Schritt.
      - name: veraPDF für die PDF/A-Prüfung
        run: |
          mvn -B -q -f tests/verapdf/pom.xml dependency:copy-dependencies \
            -DoutputDirectory="$RUNNER_TEMP/verapdf" -DincludeScope=runtime
          echo "VERAPDF=java -cp $RUNNER_TEMP/verapdf/* org.verapdf.apps.GreenfieldCliWrapper" >> "$GITHUB_ENV"
          java -cp "$RUNNER_TEMP/verapdf/*" org.verapdf.apps.GreenfieldCliWrapper --version

      # Je Kern eine Testdatei gleichzeitig, jede mit eigenem Protokoll und höchstens 15 Minuten. Was nur auf dem
      # Entwicklungsrechner liegt, entfällt: die Kopie einer Datenbank auf Stand 7 (MATERIAL_KOPIE_STAND_7) und die
      # Wiki-Artikel unter /home/harness. Am Ende stehen die Protokolle der roten Dateien aufklappbar im Log.
      - name: Testsuite
        run: |
          logs="$RUNNER_TEMP/testlogs"
          mkdir -p "$logs"
          ls tests/test_*.py | LOGS="$logs" xargs -P "$(nproc)" -n 1 sh -c '
            n=$(basename "$1" .py); s=$(date +%s)
            if timeout 900 python "$1" > "$LOGS/$n.log" 2>&1; then
              echo "ok      $n ($(( $(date +%s) - s )) s)"
            else
              rc=$?; touch "$LOGS/$n.rot"
              echo "ROT     $n (Rückgabewert $rc, $(( $(date +%s) - s )) s)"
            fi' _
          rot=0
          for f in "$logs"/*.rot; do
            [ -e "$f" ] || continue
            rot=$((rot + 1)); n=$(basename "$f" .rot)
            echo "::group::$n – letzte 300 Zeilen"
            tail -n 300 "$logs/$n.log"
            echo "::endgroup::"
            echo "::error title=$n::$n ist rot (Protokoll oben aufklappen)"
          done
          echo "$(ls tests/test_*.py | wc -l) Testdateien, davon $rot rot."
          [ "$rot" -eq 0 ]
