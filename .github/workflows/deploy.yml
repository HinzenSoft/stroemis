name: Deploy

# Baut und startet den Docker-Compose-Stack auf dem VPS neu – bei jedem Push, oder von Hand über
# "Run workflow". Zwei Umgebungen auf demselben VPS, jede in einem eigenen Klon des Repositories:
#   main  →  Produktion   (strömis.de,     Ordner DEPLOY_PATH,      Port 8080)
#   dev   →  Entwicklung  (dev.strömis.de, Ordner DEPLOY_PATH_DEV,  Port 8008)
# Der Build läuft auf dem VPS selbst (kein Registry-Umweg nötig); siehe README.md, Abschnitte
# "Automatisches Deployment" und "Entwicklungsumgebung" für die einmalige Einrichtung.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

# Läuft ein Deploy noch, wartet der nächste statt parallel zu starten – auch zwischen Produktion und
# Entwicklung: Zwei gleichzeitige "docker compose up --build" auf demselben Host wären sonst ein
# Wettlauf um dieselben Ressourcen.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Andere Zweige werden nie ausgerollt – auch nicht über "Run workflow".
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Auf dem VPS git pull und docker compose up --build ausführen (${{ github.ref_name }})
        # Auf einen festen Stand gepinnt (Tag v1 vom 2026-10-15): Ein wanderndes Tag könnte sonst
        # morgen anderen Code mit dem Deploy-Schlüssel ausführen. Zum Heben: neue Prüfsumme eintragen.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          ZWEIG: ${{ github.ref_name }}
          # Entwicklung: eigener Klon. Ohne Secret DEPLOY_PATH_DEV liegt er neben dem der Produktion
          # (DEPLOY_PATH mit „-dev“ dahinter).
          ZIEL: ${{ github.ref_name == 'main' && secrets.DEPLOY_PATH || (secrets.DEPLOY_PATH_DEV || format('{0}-dev', secrets.DEPLOY_PATH)) }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: ZWEIG,ZIEL
          script: |
            set -e
            case "$ZWEIG" in main|dev) ;; *) echo "Der Zweig $ZWEIG wird nicht ausgerollt." >&2; exit 1 ;; esac
            if [ ! -d "$ZIEL/.git" ]; then
              echo "Auf dem VPS gibt es unter $ZIEL noch keinen Klon für den Zweig $ZWEIG." >&2
              echo "Einmalig einrichten: scripts/dev-einrichten.sh (siehe README, Entwicklungsumgebung)." >&2
              exit 1
            fi
            cd "$ZIEL"
            git fetch origin "$ZWEIG"
            git checkout "$ZWEIG"
            git merge --ff-only "origin/$ZWEIG"
            # Der Container läuft als Nutzer 1000 und schreibt nach ./data. Gehört der Ordner jemand
            # anderem (oder fehlt er – dann legt Docker ihn als root an), stürbe jeder Arbeitsprozess
            # beim Start. Dann lieber hier abbrechen: Der laufende Container bleibt, wie er ist.
            if [ "$(stat -c %u data 2>/dev/null)" != "1000" ]; then
              echo "$ZIEL/data fehlt oder gehört nicht dem Nutzer 1000 – Deploy abgebrochen." >&2
              echo "Einmalig:  mkdir -p '$ZIEL/data' && sudo chown -R 1000:1000 '$ZIEL/data'" >&2
              exit 1
            fi
            docker compose up -d --build --remove-orphans
            docker image prune -f
