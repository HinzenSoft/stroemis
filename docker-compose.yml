services:
  stroemis:
    build: .
    image: stroemis:latest
    container_name: stroemis
    restart: unless-stopped
    env_file: .env
    # Auf allen Schnittstellen veröffentlicht, damit der Reverse-Proxy (TLS, Domain – siehe README)
    # auch von einem anderen Rechner aus erreicht. Achtung: Docker öffnet den Port an einer
    # ufw-Firewall vorbei, und wer den Container direkt erreicht, kann die Weiterleitungs-
    # kopfzeilen (X-Forwarded-For) selbst setzen und damit die Anmeldebremse je IP umgehen.
    # Deshalb Port 8080 am Netz nur für den Proxy freigeben (Firewall des Anbieters oder
    # Docker-eigene Regeln); läuft der Proxy auf demselben Host, genügt "127.0.0.1:8080:8080".
    ports:
      - "8080:8080"
    volumes:
      # Datenbank, Originale, Thumbnails, Wiki-Bilder, Secret-Key, Zwischendateien.
      # Der Ordner muss dem Nutzer 1000 gehören:  mkdir -p data && sudo chown -R 1000:1000 data
      - ./data:/data
    # Der Dienst braucht keine Sonderrechte: keine Capabilities, kein Rechtegewinn durch setuid.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Das Wurzeldateisystem bleibt unveränderlich: Geschrieben wird nur nach /data (Datenbank,
    # Medien, Zwischendateien unter /data/tmp) und nach /tmp, wo Gunicorn die Lebenszeichen seiner
    # Arbeitsprozesse ablegt – dafür ein flüchtiger Speicherbereich, der mit dem Container vergeht.
    read_only: true
    tmpfs:
      - /tmp
