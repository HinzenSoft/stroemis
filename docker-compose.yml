services:
  stroemis:
    build: .
    image: stroemis:latest
    container_name: stroemis
    restart: unless-stopped
    env_file: .env
    # Nur lokal veröffentlichen – TLS und die Domain übernimmt ein Reverse-Proxy (siehe README).
    ports:
      - "8080:8080"
    volumes:
      # Datenbank, Originale, Thumbnails, Wiki-Bilder, Secret-Key.
      # Alternativ ein Ordner: "./data:/data" – dann vorher  mkdir data && chown 1000:1000 data
      - ./data:/data

volumes:
  stroemis-data:
